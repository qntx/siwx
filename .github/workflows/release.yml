name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: qntx/workflows/.github/workflows/release-rust.yml@v2
    permissions:
      contents: write
    with:
      bin: siwx
      package: siwx-cli
      # The gnu builds link against glibc 2.28 (RHEL 8, Debian 10 and newer);
      # the build fails if a binary needs a newer GLIBC_x.y.
      glibc-floor: '2.28'
      # Builds an EIP-4361 message offline (nonce from OS entropy).
      smoke-command: >-
        --json evm message --domain service.org
        --address 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
        --uri https://service.org --chain-id 1
      # AlmaLinux 8 (glibc 2.28), multi-arch index digest for amd64 + arm64/v8.
      smoke-image: almalinux:8-minimal@sha256:771e3223b49005328247f22e21f41164dab2f5c3f80ba06f6f970cfd0fb3691a
