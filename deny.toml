# cargo-deny configuration for the siwx workspace.
#
# Run with `cargo deny check` to enforce supply-chain hygiene:
# - advisories: every transitive dependency must be free of known CVEs
# - bans:       the workspace ships exactly one version of every crate
# - licenses:   only permissive licenses are allowed
# - sources:    only crates.io is trusted

[graph]
all-features        = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
  # alloy-signer 2.5 pins elliptic-curve/k256 0.13 → crypto-bigint 0.5; no
  # upgrade path until alloy adopts the 0.14 curve crates.
  { id = "RUSTSEC-2026-0387", reason = "transitive via alloy k256 chain (crypto-bigint 0.5); drop when alloy moves to elliptic-curve 0.14" },
  # alloy-primitives / syn-solidity still use unmaintained `paste`.
  { id = "RUSTSEC-2024-0436", reason = "transitive via alloy-primitives and syn-solidity (unmaintained paste); drop when alloy replaces it" },
]

[licenses]
allow                = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "CC0-1.0", "ISC", "MPL-2.0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93
exceptions           = []

[bans]
multiple-versions = "warn"
wildcards         = "deny"
highlight         = "all"
allow             = []
deny              = []
skip              = []
skip-tree         = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
