[package]
name    = "siwx-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.siwx]
path     = "../crates/siwx"
features = ["evm", "svm"]

# Isolate from the parent workspace so stable `cargo test` / CI never
# requires libfuzzer or nightly.
[workspace]
members = ["."]

[[bin]]
name  = "fuzz_parse"
path  = "fuzz_targets/fuzz_parse.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "roundtrip_eip4361"
path  = "fuzz_targets/roundtrip_eip4361.rs"
test  = false
doc   = false
bench = false

[[bin]]
name = "roundtrip_siws"
path = "fuzz_targets/roundtrip_siws.rs"
doc  = false

[[bin]]
name = "svm_parse"
path = "fuzz_targets/svm_parse.rs"
doc  = false
