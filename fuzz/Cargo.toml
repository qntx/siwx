[package]
name    = "siwx-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.siwx]
path = "../crates/siwx"

# Isolate from the parent workspace so stable `cargo test` / CI never
# requires libfuzzer or nightly.
[workspace]
members = ["."]

[[bin]]
name  = "fuzz_parse"
path  = "fuzz_targets/fuzz_parse.rs"
test  = false
doc   = false
bench = false
