[package]
name = "siwx-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
siwx = { path = "../siwx" }

[[bin]]
name = "fuzz_parse"
path = "fuzz_targets/fuzz_parse.rs"
test = false
doc = false
bench = false

[workspace]
# Isolate from the parent workspace so stable `cargo test` / CI never
# requires libfuzzer or nightly.
members = ["."]
